<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#f8fafc">
  <title>见字如面 · 宇昂与凡凡</title>
  <link rel="stylesheet" href="letters.css">
  <link rel="stylesheet" href="gallery.css">
  <link rel="stylesheet" href="gallery-controls.css">
  <link rel="stylesheet" href="pups/pups.css">
  <link rel="stylesheet" href="pups/orbit.css">
  <script src="entries.js" defer></script>
  <script src="photo-index.js" defer></script>
  <script src="portrait-previews.js" defer></script>
  <script src="diary.js" defer></script>
  <script src="gallery.js" defer></script>
  <script src="hearts.js" defer></script>
  <script src="pups/album.js" defer></script>
  <script src="pups/orbit.js" defer></script>
  <script src="pups/pups.js" defer></script>
</head>
<body>
  <header class="mast">
    <a class="back" href="../index.html">返回博客</a>
    <nav aria-label="信中目录">
      <a href="#portraits">相册</a>
      <a href="journal/index.html">生活记录</a>
    </nav>
  </header>
  <main>
    <header class="cover">
      <div class="letter">
        <p class="salutation">亲爱的凡凡，</p>
        <h1>见字如面。</h1>
        <p class="note"><span>把你的模样，</span><span>和我们一起过的日子，</span><span>慢慢收在这里。</span></p>
        <p class="signature">爱你的昂昂</p>
      </div>
    </header>
    <div class="pages">
      <section class="journal-door" id="days" aria-labelledby="days-title">
        <a href="journal/index.html">
          <span class="book-spine" aria-hidden="true"></span>
          <h2 id="days-title">我与 <i lang="en">fanfan</i> 的幸福日常</h2>
          <span class="open-book">翻开年册</span>
        </a>
      </section>
      <section class="pup-studio" id="pups" aria-labelledby="pups-title" hidden>
        <header class="pup-header">
          <h2 id="pups-title">我们的可爱小狗们</h2>
          <p>轻点小狗，摸摸它</p>
        </header>
        <div class="pup-lineup" id="pup-lineup"></div>
        <span id="pup-reaction" role="status" class="pup-visually-hidden"></span>
        <dialog class="pup-album" id="pup-album" aria-labelledby="pup-album-title">
          <header class="pup-album-head">
            <h3 id="pup-album-title"></h3>
            <button type="button" class="pup-close" aria-label="关闭相册" autofocus>×</button>
          </header>
          <div class="pup-photo-stage">
            <img class="pup-photo" alt="">
            <button type="button" class="pup-edge pup-prev" aria-label="上一张照片"></button>
            <button type="button" class="pup-edge pup-next" aria-label="下一张照片"></button>
          </div>
          <footer class="pup-album-foot">
            <span class="pup-count" aria-live="polite" aria-atomic="true"></span>
            <a class="pup-original" target="_blank" rel="noopener">查看原图</a>
          </footer>
        </dialog>
      </section>
      <section id="portraits" aria-labelledby="portraits-title">
        <h2 id="portraits-title"><i lang="en">fanfan</i> 的美照</h2>
        <div id="portrait-list">
          <p class="empty">正在翻开相册…</p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
